id: enmaas
display_name: EnMaaS
description: EnMaaS GLM inference
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: EnMaaS API key
    env_vars: [ENMAAS_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: ${ENMAAS_HOST}
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/node-22, /usr/bin/node]
